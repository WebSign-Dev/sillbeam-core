deptrac:
    paths: [./src]
    layers:
        - name: Architecture
          collectors: [{ type: directory, value: 'src/Architecture/.*' }]
        - name: Module
          collectors: [{ type: directory, value: 'src/Module/.*' }]
        - name: Project
          collectors: [{ type: directory, value: 'src/Project/.*' }]
        - name: Kernel
          collectors: [{ type: directory, value: 'src/Kernel/.*' }]
        - name: Routing
          collectors: [{ type: directory, value: 'src/Routing/.*' }]
        - name: DependencyInjection
          collectors: [{ type: directory, value: 'src/DependencyInjection/.*' }]
        - name: Presentation
          collectors: [{ type: directory, value: 'src/Console/Style/.*' }]
        - name: Console
          collectors: [{ type: directory, value: 'src/Console/(?!Style/).*' }]
        - name: I18n
          collectors: [{ type: directory, value: 'src/I18n/.*' }]
        - name: Api
          collectors: [{ type: directory, value: 'src/Api/.*' }]
        - name: Bundle
          collectors: [{ type: classNameRegex, value: '#^Sillbeam\\Core\\SillbeamCoreBundle$#' }]
    ruleset:
        Architecture: [Module, Project, Presentation, I18n]
        Module: [Architecture, Project, I18n]
        Project: [Architecture, Module, I18n]
        Kernel: [Module, Presentation]
        Routing: [Module, Project]
        DependencyInjection: [Architecture, Module, Project, Kernel, Routing, Console]
        Console: [Architecture, DependencyInjection, Presentation, I18n]
        Bundle: [DependencyInjection]
        I18n: []
        Api: [I18n]
